<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Work</title>
  <link rel="stylesheet" href="./dist/output.css" />
  <script src="script/script.js" defer></script>
</head>

<body class="bg-[#0f1115] text-white min-h-screen">

  <div class="flex min-h-screen">

    <aside class="w-[280px] bg-[#111318] border-r border-white/10 px-5 py-6 flex flex-col gap-6">

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-violet-600 flex items-center justify-center text-xl font-bold">
          ✓
        </div>
        <h1 class="text-2xl font-semibold tracking-wide">My Work</h1>
      </div>

      <button
        class="create-todo flex items-center gap-4 bg-[#2c2f36] hover:bg-violet-600 transition-all duration-300 rounded-2xl px-5 py-4 font-medium shadow-lg"
      >
        <span class="text-3xl leading-none">+</span>
        <span>Create</span>
      </button>

      <div class="space-y-2">

        <button
          class="w-full text-left px-4 py-3 rounded-xl bg-blue-700/80 font-medium"
        >
          All Tasks
        </button>

        <button
          class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 transition"
        >
          Important
        </button>

        <button
          class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 transition"
        >
          Completed
        </button>

      </div>

      <div class="pt-4 border-t border-white/10 space-y-3">

        <h2 class="text-sm uppercase tracking-wider text-gray-400">
          Quick Lists
        </h2>

        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 transition">
          Daily Work
        </button>

        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 transition">
          Study Goals
        </button>

        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 transition">
          Personal Tasks
        </button>

      </div>

    </aside>

    <main class="flex-1 px-8 py-8">

      <div class="max-w-5xl mx-auto space-y-6">

        <div class="flex justify-between items-center">
          <h2 class="text-4xl font-bold">Dashboard</h2>
          <p class="text-gray-400">Stay productive today</p>
        </div>

        <div class="todo hidden bg-[#171a20] border border-white/10 rounded-3xl p-6 max-w-xl shadow-2xl">
          <form class="flex flex-col gap-4">

            <label for="title" class="text-sm text-gray-300">
              Title
            </label>

            <input
              type="text"
              id="title"
              class="title bg-[#0f1115] border border-white/10 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-500"
              placeholder="Enter task title"
            />

            <label for="description" class="text-sm text-gray-300">
              Description
            </label>

            <textarea
              id="description"
              class="bg-[#0f1115] border border-white/10 rounded-xl px-4 py-3 h-28 resize-none outline-none focus:ring-2 focus:ring-violet-500"
              placeholder="Enter task details"
            ></textarea>

            <button
              type="submit"
              class="submit bg-violet-600 hover:bg-violet-700 rounded-xl py-3 font-semibold transition"
            >
              Save Task
            </button>
          </form>
        </div>

        <div
          class="savedTodo grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"
        >
        </div>

      </div>

    </main>

  </div>

</body>
</html>
